spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: mobile_mechanic_marketplace
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_HOST_PORT:5434}/${POSTGRES_DB:mydatabase}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:myuser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:secret}}
  docker:
    compose:
      skip:
        in-test: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog.xml
  jpa:
    hibernate:
      ddl-auto: none
server:
  port: ${SERVER_PORT:8080}